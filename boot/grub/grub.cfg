set timeout=5
set default=0
set gfxpayload=text

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

menuentry "Cruzeiro OS - CZK_x86" {
  multiboot2 /boot/czk_x86.bin
  module2 /boot/initrd.tar initrd
  boot
}

menuentry "Cruzeiro OS - CZK_x86-64" {
  multiboot2 /boot/czk_x86_64.bin
  boot
}
